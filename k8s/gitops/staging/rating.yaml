apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: rating, namespace: yas-staging, labels: { app: rating, env: staging } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: rating } }
      template:
        metadata: { labels: { app: rating, env: staging } }
        spec:
          containers:
            - name: rating
              image: khanhnv2281/yas:rating-latest
              ports: [{ containerPort: 8089 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: rating, namespace: yas-staging, labels: { app: rating, env: staging } }
    spec:
      selector: { app: rating }
      ports: [{ name: http, port: 80, targetPort: 8089 }]
