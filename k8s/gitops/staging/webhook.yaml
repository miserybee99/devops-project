apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: webhook, namespace: yas-staging, labels: { app: webhook, env: staging } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: webhook } }
      template:
        metadata: { labels: { app: webhook, env: staging } }
        spec:
          containers:
            - name: webhook
              image: khanhnv2281/yas:webhook-latest
              ports: [{ containerPort: 8092 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: webhook, namespace: yas-staging, labels: { app: webhook, env: staging } }
    spec:
      selector: { app: webhook }
      ports: [{ name: http, port: 80, targetPort: 8092 }]
