apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: product, namespace: yas-staging, labels: { app: product, env: staging } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: product } }
      template:
        metadata: { labels: { app: product, env: staging } }
        spec:
          containers:
            - name: product
              image: khanhnv2281/yas:product-latest
              ports: [{ containerPort: 8080 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: product, namespace: yas-staging, labels: { app: product, env: staging } }
    spec:
      selector: { app: product }
      ports: [{ name: http, port: 80, targetPort: 8080 }]
