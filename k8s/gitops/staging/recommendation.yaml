apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: recommendation, namespace: yas-staging, labels: { app: recommendation, env: staging } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: recommendation } }
      template:
        metadata: { labels: { app: recommendation, env: staging } }
        spec:
          containers:
            - name: recommendation
              image: khanhnv2281/yas:recommendation-latest
              ports: [{ containerPort: 8095 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: recommendation, namespace: yas-staging, labels: { app: recommendation, env: staging } }
    spec:
      selector: { app: recommendation }
      ports: [{ name: http, port: 80, targetPort: 8095 }]
