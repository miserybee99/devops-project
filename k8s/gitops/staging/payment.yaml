apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: payment, namespace: yas-staging, labels: { app: payment, env: staging } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: payment } }
      template:
        metadata: { labels: { app: payment, env: staging } }
        spec:
          containers:
            - name: payment
              image: khanhnv2281/yas:payment-latest
              ports: [{ containerPort: 8081 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: payment, namespace: yas-staging, labels: { app: payment, env: staging } }
    spec:
      selector: { app: payment }
      ports: [{ name: http, port: 80, targetPort: 8081 }]
