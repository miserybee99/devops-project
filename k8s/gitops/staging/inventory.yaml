apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: inventory, namespace: yas-staging, labels: { app: inventory, env: staging } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: inventory } }
      template:
        metadata: { labels: { app: inventory, env: staging } }
        spec:
          containers:
            - name: inventory
              image: khanhnv2281/yas:inventory-latest
              ports: [{ containerPort: 8090 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: inventory, namespace: yas-staging, labels: { app: inventory, env: staging } }
    spec:
      selector: { app: inventory }
      ports: [{ name: http, port: 80, targetPort: 8090 }]
