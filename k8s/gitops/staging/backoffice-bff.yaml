apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: backoffice-bff, namespace: yas-staging, labels: { app: backoffice-bff, env: staging } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: backoffice-bff } }
      template:
        metadata: { labels: { app: backoffice-bff, env: staging } }
        spec:
          containers:
            - name: backoffice-bff
              image: khanhnv2281/yas:backoffice-bff-latest
              ports: [{ containerPort: 8080 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: backoffice-bff, namespace: yas-staging, labels: { app: backoffice-bff, env: staging } }
    spec:
      selector: { app: backoffice-bff }
      ports: [{ name: http, port: 80, targetPort: 8080 }]
