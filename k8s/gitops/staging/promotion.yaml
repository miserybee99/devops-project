apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: promotion, namespace: yas-staging, labels: { app: promotion, env: staging } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: promotion } }
      template:
        metadata: { labels: { app: promotion, env: staging } }
        spec:
          containers:
            - name: promotion
              image: khanhnv2281/yas:promotion-latest
              ports: [{ containerPort: 8092 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: promotion, namespace: yas-staging, labels: { app: promotion, env: staging } }
    spec:
      selector: { app: promotion }
      ports: [{ name: http, port: 80, targetPort: 8092 }]
