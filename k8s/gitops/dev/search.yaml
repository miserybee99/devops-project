apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: search, namespace: yas-dev, labels: { app: search, env: dev } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: search } }
      template:
        metadata: { labels: { app: search, env: dev } }
        spec:
          containers:
            - name: search
              image: khanhnv2281/yas:search-latest
              ports: [{ containerPort: 8092 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: search, namespace: yas-dev, labels: { app: search, env: dev } }
    spec:
      selector: { app: search }
      ports: [{ name: http, port: 80, targetPort: 8092 }]
