apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: location, namespace: yas-dev, labels: { app: location, env: dev } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: location } }
      template:
        metadata: { labels: { app: location, env: dev } }
        spec:
          containers:
            - name: location
              image: khanhnv2281/yas:location-latest
              ports: [{ containerPort: 8086 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: location, namespace: yas-dev, labels: { app: location, env: dev } }
    spec:
      selector: { app: location }
      ports: [{ name: http, port: 80, targetPort: 8086 }]
