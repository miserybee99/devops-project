apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: tax, namespace: yas-dev, labels: { app: tax, env: dev } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: tax } }
      template:
        metadata: { labels: { app: tax, env: dev } }
        spec:
          containers:
            - name: tax
              image: khanhnv2281/yas:tax-latest
              ports: [{ containerPort: 8091 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: tax, namespace: yas-dev, labels: { app: tax, env: dev } }
    spec:
      selector: { app: tax }
      ports: [{ name: http, port: 80, targetPort: 8091 }]
