apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: media, namespace: yas-dev, labels: { app: media, env: dev } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: media } }
      template:
        metadata: { labels: { app: media, env: dev } }
        spec:
          containers:
            - name: media
              image: khanhnv2281/yas:media-latest
              ports: [{ containerPort: 8083 }]
  - apiVersion: v1
    kind: Service
    metadata: { name: media, namespace: yas-dev, labels: { app: media, env: dev } }
    spec:
      selector: { app: media }
      ports: [{ name: http, port: 80, targetPort: 8083 }]
